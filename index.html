<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloom — Your Daily To-Do</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ░░ FLORAL SVG DECORATIONS ░░ -->
  <div class="floral-bg" aria-hidden="true">
    <svg class="floral floral--tl" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.55">
        <ellipse cx="100" cy="60" rx="22" ry="38" fill="#f4a7b9" transform="rotate(-20 100 60)"/>
        <ellipse cx="100" cy="60" rx="22" ry="38" fill="#f9c8d4" transform="rotate(20 100 60)"/>
        <ellipse cx="100" cy="60" rx="22" ry="38" fill="#f4a7b9" transform="rotate(70 100 60)"/>
        <ellipse cx="100" cy="60" rx="22" ry="38" fill="#f9c8d4" transform="rotate(-70 100 60)"/>
        <circle cx="100" cy="60" r="14" fill="#ffe0e8"/>
        <circle cx="100" cy="60" r="7" fill="#f4a7b9"/>
        <line x1="100" y1="98" x2="100" y2="200" stroke="#b8d4a8" stroke-width="2.5"/>
        <ellipse cx="85" cy="148" rx="16" ry="10" fill="#c8e6b8" transform="rotate(-30 85 148)"/>
        <ellipse cx="115" cy="168" rx="16" ry="10" fill="#b8d4a8" transform="rotate(30 115 168)"/>
      </g>
    </svg>
    <svg class="floral floral--br" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.5">
        <line x1="90" y1="0" x2="90" y2="130" stroke="#c8b4e0" stroke-width="2.5"/>
        <ellipse cx="75" cy="60" rx="14" ry="9" fill="#d4c0ec" transform="rotate(-25 75 60)"/>
        <ellipse cx="105" cy="80" rx="14" ry="9" fill="#c8b4e0" transform="rotate(25 105 80)"/>
        <ellipse cx="90" cy="130" rx="20" ry="32" fill="#b8a4d8" transform="rotate(-15 90 130)"/>
        <ellipse cx="90" cy="130" rx="20" ry="32" fill="#c8b4e0" transform="rotate(15 90 130)"/>
        <ellipse cx="90" cy="130" rx="20" ry="32" fill="#d4c0ec" transform="rotate(55 90 130)"/>
        <ellipse cx="90" cy="130" rx="20" ry="32" fill="#b8a4d8" transform="rotate(-55 90 130)"/>
        <circle cx="90" cy="130" r="12" fill="#e8daf4"/>
        <circle cx="90" cy="130" r="6" fill="#c8b4e0"/>
      </g>
    </svg>
  </div>

  <!-- ░░ APP SHELL ░░ -->
  <div class="app-wrapper">

    <!-- SIDEBAR NAV -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar__logo">
        <span class="logo-icon">🌸</span>
        <span class="logo-text">Bloom</span>
      </div>
      <ul class="sidebar__nav">
        <li><a href="#" class="nav-item active" data-view="today" title="Today">
          <span class="nav-icon">☀️</span><span class="nav-label">Today</span>
        </a></li>
        <li><a href="#" class="nav-item" data-view="weekly" title="Weekly">
          <span class="nav-icon">📅</span><span class="nav-label">Weekly</span>
        </a></li>
        <li><a href="#" class="nav-item" data-view="all" title="All Tasks">
          <span class="nav-icon">🌿</span><span class="nav-label">All Tasks</span>
        </a></li>
        <li><a href="#" class="nav-item" data-view="completed" title="Completed">
          <span class="nav-icon">✨</span><span class="nav-label">Completed</span>
        </a></li>
      </ul>
      <div class="sidebar__categories">
        <p class="sidebar__section-title">Categories</p>
        <div class="category-chips" id="categoryChips"></div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">

      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar__left">
          <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
          </button>
          <div class="topbar__title-group">
            <h1 class="topbar__title" id="viewTitle">Good morning 🌸</h1>
            <p class="topbar__subtitle" id="viewDate"></p>
          </div>
        </div>
        <div class="topbar__right">
          <button class="search-btn" id="searchBtn" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
          <button class="add-btn" id="addBtn" aria-label="Add task">+</button>
        </div>
      </header>

      <!-- SEARCH BAR (hidden by default) -->
      <div class="search-bar-wrap" id="searchBarWrap">
        <input type="text" class="search-bar" id="searchInput" placeholder="Search tasks…" />
      </div>

      <!-- STATS ROW -->
      <section class="stats-row" id="statsRow">
        <div class="stat-card stat-card--pink">
          <span class="stat-num" id="statTotal">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card stat-card--lavender">
          <span class="stat-num" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card stat-card--mint">
          <span class="stat-num" id="statDone">0</span>
          <span class="stat-label">Done</span>
        </div>
        <div class="stat-card stat-card--peach">
          <span class="stat-num" id="statOverdue">0</span>
          <span class="stat-label">Overdue</span>
        </div>
      </section>

      <!-- FILTER BAR -->
      <div class="filter-bar" id="filterBar">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="High">🔴 High</button>
        <button class="filter-chip" data-filter="Medium">🟡 Medium</button>
        <button class="filter-chip" data-filter="Low">🟢 Low</button>
      </div>

      <!-- TASK LIST -->
      <section class="task-list" id="taskList">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">🌷</div>
          <p class="empty-title">Your garden is empty</p>
          <p class="empty-sub">Tap <strong>+</strong> to plant your first task</p>
        </div>
      </section>

    </main>
  </div>

  <!-- ░░ ADD / EDIT MODAL ░░ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">New Task 🌸</h2>
        <button class="modal__close" id="modalClose" aria-label="Close">✕</button>
      </div>
      <form class="modal__form" id="taskForm" novalidate>
        <input type="hidden" id="editId" />

        <div class="form-group">
          <label for="taskTitle">Task Title *</label>
          <input type="text" id="taskTitle" placeholder="What needs to bloom today?" maxlength="120" required />
        </div>

        <div class="form-group">
          <label for="taskDesc">Notes</label>
          <textarea id="taskDesc" placeholder="Add details…" rows="2" maxlength="500"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="High">🔴 High</option>
              <option value="Medium" selected>🟡 Medium</option>
              <option value="Low">🟢 Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDue">Due Date</label>
            <input type="date" id="taskDue" />
          </div>
        </div>

        <div class="form-group">
          <label for="taskCategory">Category</label>
          <input type="text" id="taskCategory" placeholder="e.g. Work, Personal, Study" maxlength="40" list="categorySuggestions" />
          <datalist id="categorySuggestions"></datalist>
        </div>

        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn--primary" id="saveBtn">Save Task 🌸</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ░░ DELETE CONFIRM ░░ -->
  <div class="modal-overlay" id="deleteOverlay">
    <div class="modal modal--small" role="dialog">
      <div class="delete-icon">🌹</div>
      <h3 class="delete-title">Remove this task?</h3>
      <p class="delete-sub">This bloom will be gone forever.</p>
      <div class="modal__actions">
        <button class="btn btn--ghost" id="deleteCancelBtn">Keep it</button>
        <button class="btn btn--danger" id="deleteConfirmBtn">Remove</button>
      </div>
    </div>
  </div>

  <!-- ░░ TOAST ░░ -->
  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
